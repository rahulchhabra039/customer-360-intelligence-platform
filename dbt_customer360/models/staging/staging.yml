version: 2

models:
  - name: stg_crm_customers
    description: Clean staging view of CRM customer records.
    columns:
      - name: customer_id
        description: Unique identifier for each customer.
        data_tests:
          - not_null
          - unique

  - name: stg_crm_identity_map
    description: Mapping between GA4 users and CRM customers.
    columns:
      - name: user_pseudo_id
        description: Anonymous GA4 user identifier.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: CRM customer identifier.
        data_tests:
          - not_null

  - name: stg_sales_orders
    description: Clean staging view of customer sales orders.
    columns:
      - name: order_id
        description: Unique identifier for each order.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer identifier; null for guest or unmatched orders.

  - name: stg_ga4_events
    description: Clean staging view of GA4 event-level data.
    columns:
      - name: event_name
        description: Name of the GA4 event.
        data_tests:
          - not_null
      - name: event_timestamp
        description: Timestamp when the event occurred.
        data_tests:
          - not_null